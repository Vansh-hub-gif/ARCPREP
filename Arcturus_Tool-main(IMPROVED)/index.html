<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background-color: #0e1117;
    color: white;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;
  }
  .header {
    color: #FFD700;
    font-size: 80px;
    font-weight: 900;
    margin-bottom: 10px;
    letter-spacing: 2px;
  }
  .subtitle {
    color: #8b949e;
    font-size: 24px;
    margin-bottom: 80px;
    text-transform: uppercase;
    letter-spacing: 4px;
  }
  .hook {
    font-size: 60px;
    font-weight: 800;
    margin: 10px 0;
  }
  .red { color: #e74c3c; }
  .green { color: #2ecc71; }
  .stats-container {
    display: flex;
    gap: 60px;
    margin-top: 80px;
  }
  .stat-box {
    background-color: #161b22;
    border: 2px solid #30363d;
    border-radius: 15px;
    padding: 30px 40px;
  }
  .stat-number {
    font-size: 48px;
    font-weight: 800;
    margin-bottom: 5px;
  }
  .blue { color: #58a6ff; }
  .stat-label {
    color: #8b949e;
    font-size: 18px;
    font-weight: 600;
    text-transform: uppercase;
  }
</style>
</head>
<body>

  <div class="header">IPL CRUNCH '26</div>
  <div class="subtitle">Five Seasons Decoded &bull; Data Analysis</div>

  <div class="hook red">THE TOSS IS A MYTH.</div>
  <div class="hook green">DEATH OVERS WIN MATCHES.</div>

  <div class="stats-container">
    <div class="stat-box">
      <div class="stat-number blue">289,673</div>
      <div class="stat-label">Balls Analyzed</div>
    </div>
    <div class="stat-box">
      <div class="stat-number red">50.5%</div>
      <div class="stat-label">Toss Win Rate</div>
    </div>
    <div class="stat-box">
      <div class="stat-number green">+27.3%</div>
      <div class="stat-label">Death Overs Gap</div>
    </div>
  </div>

</body>
</html>
